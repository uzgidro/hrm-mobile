name: OTA Update (EAS Update)

# Ship JS/asset-only changes to users without a store build. Pushing to master
# publishes an update to the "production" channel; installed apps download it on
# their next launch and apply it on the launch after that.
#
# runtimeVersion is "appVersion" (see app.json), so an update only reaches
# binaries built from the same app.json version — a native change that isn't
# accompanied by a version bump would otherwise ship JS that needs a missing
# native module. TEAM RULE: any change to native deps (package.json) or plugins
# (app.json) MUST bump expo.version in the same PR, then go out as a store
# release, not an OTA.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      message:
        description: Update message shown on expo.dev
        required: false
        default: manual dispatch

concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Don't ship broken or vulnerable JS over the air — gate on green checks
      # and the same high/critical dependency audit as CI.
      - name: Typecheck & test
        run: |
          npm run typecheck
          npx jest --ci
      - name: Audit (fail on non-allowlisted high/critical)
        run: npm run audit:gate

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        # push -> commit message; manual dispatch -> the input (default below).
        #
        # The message is passed through an ENV var, never interpolated directly
        # into the run script: a commit body can contain backticks, $(...) or
        # newlines (e.g. "3*ceil(tile)+2*gap"), which — pasted straight into the
        # shell via ${{ }} — bash re-parses as command substitution and the step
        # dies with "syntax error near unexpected token" before eas even runs.
        # In an env var the value is literal. We also take only the SUBJECT
        # (first line) of the commit so a long body can't derail the command.
        env:
          RAW_MESSAGE: ${{ github.event.head_commit.message || github.event.inputs.message }}
        run: |
          MSG="$(printf '%s' "$RAW_MESSAGE" | head -n1)"
          eas update --channel production --message "$MSG" --non-interactive
