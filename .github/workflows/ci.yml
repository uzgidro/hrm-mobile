name: CI

# Static checks on every PR and on pushes to master.
# Keeps master (the release branch) green before anything ships.
# Split into independent jobs so a failure points straight at what broke
# (typecheck vs lint vs test vs vulnerable deps) and they run in parallel.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npx jest --ci

  # Dependency vulnerability gate. Fails on any high/critical advisory EXCEPT a
  # small allowlist of build/dev-time-only advisories that have no fix short of a
  # breaking toolchain downgrade (see scripts/audit-gate.mjs — each entry names
  # the package and why). A new advisory outside that list, or a runtime-dep
  # advisory, still fails the build; when a real fix ships the entry is removed.
  # Prefer pinning a fixed transitive version via `overrides` over allowlisting.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Report all advisories
        run: npm audit || true
      - name: Fail on non-allowlisted high/critical
        run: npm run audit:gate
