name: Release to Google Play (internal)

# Tag a commit on master as v<app.json version> (e.g. v1.1.0) to ship a store
# build: EAS builds the app-bundle on Expo's servers and auto-submits it to the
# Google Play *internal* track. Promotion to production stays manual in the
# Play Console.
#
# Split into gates: verify (tag == version) and checks (typecheck/test/audit)
# must pass before build-and-submit runs, so a broken or vulnerable release
# never reaches the store.
on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The store version comes from app.json; the tag is just the trigger.
      - name: Verify tag matches app.json version
        run: |
          node -e "const v=require('./app.json').expo.version; const tag=process.env.GITHUB_REF_NAME; if ('v'+v!==tag) { console.error('Tag '+tag+' does not match app.json version '+v); process.exit(1); }"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npx jest --ci
      # Same dependency gate as CI — fail on non-allowlisted high/critical
      # advisories (see scripts/audit-gate.mjs). Don't ship a vulnerable build.
      - run: npm run audit:gate

  build-and-submit:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas submit reads this path from the submit profile in eas.json.
      - name: Write Play service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > ./playstore-service-account.json

      # Build the production app-bundle and submit it to Play internal.
      # NOTE: --no-wait was removed (2026-08-05). With it, the CI job ended in
      # ~1 min right after enqueueing the build, and the follow-up auto-submit
      # never landed in Play (build 27146cf3 finished but 1.5.0 was absent from
      # the internal track). Waiting keeps the service-account key present for
      # the whole build+submit and makes the job's success reflect the submit.
      - name: Build & auto-submit to Play internal track
        run: eas build --platform android --profile production --non-interactive --auto-submit
