# Smoke-navigate every v3 bottom tab and assert each screen renders its content.
# Assumes an authenticated employee session (run login.yaml first, or launch
# already logged in).
#
# Tabs are tapped by testID (tab-home/attendance/documents/modules/profile, set
# by TAB_META in src/utils/tabs.ts → TabBar). Assertions target on-screen content.
appId: uz.uzgidro.hrm
---
- launchApp
- assertVisible:
    id: 'home-greeting'

# Hujjatlar — Buyruqlar · Xatlar · Hujjatlar segmentlari
- tapOn:
    id: 'tab-documents'
- assertVisible: 'Menda' # orders filter chip (default segment)
- tapOn: 'Xatlar'
- assertVisible:
    id: 'letters-create'

# Modullar (v2 katalogi)
- tapOn:
    id: 'tab-modules'
- assertVisible:
    text: 'Modullar'
    index: 0

# Mehmonlar — Modullar plitkasi orqali
- tapOn:
    id: 'module-guests'
- assertVisible:
    text: 'Mehmonlar'
    index: 0

# Back to the dashboard
- tapOn:
    id: 'tab-home'
- assertVisible:
    id: 'home-greeting'
