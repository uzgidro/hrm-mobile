<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="240" height="260">
  <title>Tomchi — UGE HRM maskoti</title>
  <!-- Yer soyasi -->
  <ellipse id="ground-shadow" cx="60" cy="124" rx="28" ry="4" fill="#0B2A40" opacity="0.12"/>

  <!-- Tana: suv tomchisi -->
  <path id="body" d="M60 27 C60 27 25 56 25 80 A35 35 0 0 0 95 80 C95 56 60 27 60 27 Z" fill="#1CB0F6"/>
  <path id="body-shade" d="M60 27 C60 27 25 56 25 80 A35 35 0 0 0 60 115 A35 35 0 0 1 40 80 C40 60 60 27 60 27 Z" fill="#0E8FD6"/>
  <ellipse id="body-gloss" cx="36" cy="66" rx="3.5" ry="7.5" fill="#FFFFFF" opacity="0.4" transform="rotate(18 36 66)"/>

  <!-- Kaska -->
  <g id="helmet">
    <path id="helmet-dome" d="M31 53 C31 31 44 20 60 20 C76 20 89 31 89 53 Z" fill="#FFC800"/>
    <path id="helmet-ridge" d="M54.5 21.5 C58 20.3 62 20.3 65.5 21.5 L64.5 53 L55.5 53 Z" fill="#F2B700"/>
    <path id="helmet-highlight" d="M38 45 C38 34 44 27 52 24.5 C46 30 43 37 42.5 45 Z" fill="#FFFFFF" opacity="0.45"/>
    <path id="helmet-brim" d="M22 53.5 C40 49 80 49 98 53.5 C99.5 54.2 99.5 57.6 97.5 58 C80 55.2 40 55.2 22.5 58 C20.5 57.6 20.5 54.2 22 53.5 Z" fill="#E5A800"/>
    <g id="badge-uge">
      <path d="M47.5 35 h2.6 v5.2 a1.7 1.7 0 0 0 3.4 0 v-5.2 h2.6 v5.2 a4.3 4.3 0 0 1 -8.6 0 Z" fill="#0283DE"/>
      <path d="M65 36.6 A4.4 4.4 0 1 0 65 42.4 L62.9 41.1 A2 2 0 1 1 62.9 37.9 Z" fill="#0283DE"/>
      <path d="M66.4 35 h6.1 v2.3 h-6.1 Z M66.4 41.7 h6.1 v2.3 h-6.1 Z" fill="#0283DE"/>
      <path d="M60.2 39.7 L70 37.2 L68.5 38.9 L74.2 39.3 L64 42.1 L65.6 40.3 Z" fill="#0AC341" stroke="#FFFFFF" stroke-width="0.6" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Ko'zlar -->
  <g id="eye-left">
    <ellipse cx="48" cy="76" rx="8.5" ry="9.5" fill="#FFFFFF"/>
    <circle class="pupil" cx="49" cy="77" r="4.3" fill="#1F2A30"/>
    <circle class="glint" cx="50.4" cy="75.4" r="1.4" fill="#FFFFFF"/>
  </g>
  <g id="eye-right">
    <ellipse cx="72" cy="76" rx="8.5" ry="9.5" fill="#FFFFFF"/>
    <circle class="pupil" cx="73" cy="77" r="4.3" fill="#1F2A30"/>
    <circle class="glint" cx="74.4" cy="75.4" r="1.4" fill="#FFFFFF"/>
  </g>

  <!-- Yuz -->
  <ellipse id="cheek-left" cx="38" cy="89" rx="4.5" ry="2.8" fill="#FF9DB8" opacity="0.9"/>
  <ellipse id="cheek-right" cx="82" cy="89" rx="4.5" ry="2.8" fill="#FF9DB8" opacity="0.9"/>
  <path id="mouth" d="M53 91 Q60 98 67 91" fill="none" stroke="#1F2A30" stroke-width="3" stroke-linecap="round"/>
  <!-- Qo'llar: sariq ish qo'lqoplari (old qatlam — ko'zni yopish uchun yuz ustiga chiqadi) -->
  <g id="hand-left">
    <circle cx="32" cy="102" r="9.5" fill="#FFD23F" stroke="#E0A400" stroke-width="1"/>
    <path d="M28 96.5 v3.5 M32 95.5 v4 M36 96.5 v3.5" fill="none" stroke="#E0A400" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <g id="hand-right">
    <circle cx="88" cy="102" r="9.5" fill="#FFD23F" stroke="#E0A400" stroke-width="1"/>
    <path d="M84 96.5 v3.5 M88 95.5 v4 M92 96.5 v3.5" fill="none" stroke="#E0A400" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
